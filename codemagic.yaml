workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: 3.44.0
      xcode: latest
    scripts:
      - name: Generate iOS folder
        script: flutter create --platforms=ios .
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa